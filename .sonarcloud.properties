# SonarCloud Automatic Analysis config (CI-less scanning; this file, not
# sonar-project.properties, is what Automatic Analysis reads).
sonar.sources=web/src
# Keep in sync with sonar-project.properties. The retired pre-nav flow lives in
# archive/ at the repo root — already outside sonar.sources (web/src).
sonar.exclusions=web/node_modules/**,web/dist/**,web/public/**,archive/**
