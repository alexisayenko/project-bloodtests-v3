<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#062a4f" />
  <meta name="description" content="Paneloom tracks your blood tests over time and across labs, entirely in your browser's local storage — no server, no account — with cited clinical indices." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>Paneloom</title>
  <!-- Preload+swap keeps the font off the render-blocking path; display=optional avoids a late swap. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=optional"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=optional"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=optional"
    />
  </noscript>
  <!-- The default route needs both; preloading starts the fetches in parallel with the JS bundle. -->
  <link rel="preload" as="fetch" href="/data/panels.json" crossorigin />
  <link rel="preload" as="fetch" href="/data/monitoring-panels.json" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
