<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#062a4f" />
  <meta name="description" content="Paneloom tracks your blood tests over time and across labs, entirely in your browser's local storage — no server, no account — with cited clinical indices." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>Paneloom</title>
  <!-- Manrope was loaded via a CSS @import in index.css, which is inherently
       render-blocking (a stylesheet can't defer its own @import). Moved here
       with the standard preload+swap pattern so it stops blocking first
       paint. display=optional means the browser never blocks text on it
       anyway -- the fallback stack in index.css's body rule renders
       immediately, and Manrope swaps in only if it's already cached/fetched
       by the time layout happens, so there's no risk of a late, jarring
       font swap either. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=optional"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=optional"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=optional"
    />
  </noscript>
  <!-- Monitoring Panels (the default route) can't render until both of these
       resolve; DataContext only fetches them once its own module runs, which
       waits for the JS bundle to parse and execute first, adding ~260ms of
       serial latency to the critical path. Preloading here lets the browser
       start both fetches in parallel with the JS download instead. -->
  <link rel="preload" as="fetch" href="/data/panels.json" crossorigin />
  <link rel="preload" as="fetch" href="/data/monitoring-panels.json" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
