# SonarCloud CI-based analysis (used by .github/workflows/ci.yml's scan step,
# which activates once the SONAR_TOKEN secret exists; Automatic Analysis must
# be switched OFF at that point — the two modes conflict).
sonar.organization=alexisayenko
sonar.projectKey=alexisayenko_project-bloodtests-v3

sonar.sources=web/src
sonar.tests=web/test
sonar.test.inclusions=web/test/**/*.ts

# Coverage (LCOV emitted by `npm run coverage`, path relative to repo root)
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# The retired pre-nav flow lives in archive/ at the repo root — already
# outside sonar.sources (web/src), so it needs no exclusion here.
sonar.exclusions=web/node_modules/**,web/dist/**,web/public/**,archive/**

# S7748 (write 2 not 2.0) is noise in a numeric-threshold domain — trailing .0 signals "float threshold".
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7748
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts
# S107 (too many parameters) in the camera ported from project-moodtracker: the
# 9-arg project() signature is the hot per-point path; scoped to that file only.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=web/src/components/analytics/chart3d-camera.ts

# Coverage denominator matches v2's philosophy: measure the testable logic
# (data/, utils/, and pure conditions/ modules), not the React view layer.
# Views/contexts stay fully ANALYZED (issues, smells) — only the coverage
# metric skips them until they get component tests.
# chart3d-*.ts is the ported 3D canvas engine: drawing code with no DOM-free
# seam to unit-test, so it counts with the view layer.
sonar.coverage.exclusions=web/src/utils/analysis.ts,web/src/main.tsx,web/src/App.tsx,web/src/**/*.tsx,web/src/vite-env.d.ts,web/src/i18n/**,web/src/hooks/**,web/src/styles/**,web/src/components/analytics/chart3d-*.ts
